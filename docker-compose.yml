name: mze-store

# The backend and the one-shot migration job are the same image with the same
# settings; they must agree on every one of these or one migrates a database the
# other never serves.
x-medusa-build: &medusa-build
  context: .
  dockerfile: apps/medusa/Dockerfile

x-medusa-env: &medusa-env
  # sslmode=disable because Medusa turns SSL on by default for any host that
  # isn't localhost, and the compose Postgres does not speak it. The symptom is
  # not a refusal: `medusa db:migrate` hangs, then blames the URL.
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/mze-store?sslmode=disable
  REDIS_URL: redis://redis:6379
  # The defaults suit the local stack. A storefront on another origin must
  # export these, or Medusa rejects its requests, sign-in included.
  STORE_CORS: ${STORE_CORS:-http://localhost:3001}
  ADMIN_CORS: ${ADMIN_CORS:-http://localhost:9000}
  AUTH_CORS: ${AUTH_CORS:-http://localhost:3001,http://localhost:9000}
  # Local defaults so `docker compose up` works from a clean checkout. A
  # deployment supplies real values; these two sign admin sessions and Operator
  # tokens.
  JWT_SECRET: ${JWT_SECRET:-local-development-only}
  COOKIE_SECRET: ${COOKIE_SECRET:-local-development-only}
  # Supply this through the shell or the root .env file. The backend rejects an
  # empty value before it starts.
  STRIPE_API_KEY: ${STRIPE_API_KEY:-}

services:
  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    init: true
    ports:
      - "3001:3001"
    env_file:
      - path: apps/storefront/.env
        required: false
    environment:
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/mze-store
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Migrations are their own service so the backend image's command stays a
  # plain `medusa start`, which is what a real deployment wants to run. Without
  # this, `docker compose up` on a fresh volume serves an unmigrated database
  # and still reports healthy, because /health does not look at schema.
  medusa-migrate:
    build: *medusa-build
    command: ["../../node_modules/.bin/medusa", "db:migrate"]
    environment: *medusa-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  medusa:
    build: *medusa-build
    init: true
    ports:
      - "9000:9000"
    # No env_file: `environment` outranks it, so every key above would be
    # unoverridable anyway, and apps/medusa/.env holds localhost addresses that
    # are wrong from inside the network. Override with shell variables instead.
    environment: *medusa-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      medusa-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:9000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: mze-store-postgres
    environment:
      POSTGRES_DB: mze-store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - mze-store_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: mze-store-redis
    # Append-only persistence, because the workflow engine keeps in-flight
    # workflow state here. Losing it on a restart is the "charged, no order"
    # failure ADR-0006 is about, so an ephemeral Redis would defeat the point of
    # having one.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - mze-store_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mze-store_postgres_data:
  mze-store_redis_data:
