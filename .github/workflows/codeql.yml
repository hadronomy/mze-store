name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: "19 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-trusted:
    name: CodeQL (${{ matrix.language }}, uploaded)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - javascript-typescript
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run trusted CodeQL analysis
        uses: ./.github/actions/run-codeql
        with:
          language: ${{ matrix.language }}
          upload: always
          artifact-scope: uploaded
          retention-days: 90
