name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STRIPE_API_KEY: sk_test_ci

jobs:
  checks:
    name: Types, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add workspace binaries to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run repository checks
        run: bun run check

      - name: Run declared tests
        run: bun run test

  oxlint-benchmark:
    name: Oxlint benchmark (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the Oxlint benchmark
        continue-on-error: true
        run: >-
          ./node_modules/.bin/vp test bench --run
          tooling/oxlint/test/visitor.bench.ts

  tooling-live:
    name: Effect tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live process tests
        run: ./node_modules/.bin/vp test tooling/mze/child-command.test.ts tooling/mze/cli.live.test.ts

      - name: Run live process tests in a container
        if: matrix.os == 'ubuntu-latest'
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          node:24.18.1-bookworm
          ./node_modules/.bin/vp test tooling/mze/cli.live.test.ts

  docker-integration:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and start the applications
        run: docker compose up --detach --build --wait --wait-timeout 180 medusa storefront

      - name: Check the applications
        shell: bash
        run: |
          set -euo pipefail
          medusa_port="$(docker compose port medusa 9000 | sed 's/.*://')"
          storefront_port="$(docker compose port storefront 3001 | sed 's/.*://')"
          curl --fail --silent --show-error "http://127.0.0.1:${medusa_port}/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${medusa_port}/app" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${storefront_port}/" >/dev/null

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  docker-image-pr:
    name: Docker image validation (${{ matrix.name }})
    needs:
      - checks
      - docker-integration
      - tooling-live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: medusa
            dockerfile: apps/medusa/Dockerfile
          - name: storefront
            dockerfile: apps/storefront/Dockerfile
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the pull-request image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: mze-store-${{ matrix.name }}:pr
          cache-from: type=gha,scope=mze-store-${{ matrix.name }}-main
          cache-to: type=gha,mode=min,scope=mze-store-${{ matrix.name }}-pr-${{ github.event.pull_request.number || github.ref_name }}

      - name: Gate fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: mze-store-${{ matrix.name }}:pr
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - checks
      - tooling-live
      - docker-integration
      - docker-image-pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require applicable checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' <<<"$CHECK_RESULTS"
