name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  STRIPE_API_KEY: sk_test_ci

jobs:
  checks:
    name: Types, lint, and tests
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Find the Bun download cache
        id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun download cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-download-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-${{ hashFiles('bun.lock') }}

      - name: Start the install timer
        run: echo "INSTALL_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record the install time
        run: echo "INSTALL_SECONDS=$(($(date +%s) - INSTALL_STARTED))" >> "$GITHUB_ENV"

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-${{ github.event.pull_request.number || github.ref_name }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-

      - name: Add workspace binaries to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Run repository checks
        id: repository-checks
        run: |
          echo "CHECK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          bun run check

      - name: Record check duration
        if: always()
        run: echo "CHECK_SECONDS=$(($(date +%s) - CHECK_STARTED))" >> "$GITHUB_ENV"

      - name: Run declared tests
        run: bun run test

      - name: Save Bun download cache
        if: success() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      - name: Report application check metrics
        if: always()
        env:
          BUN_CACHE_HIT: ${{ steps.bun-cache.outputs.cache-matched-key != '' }}
          BUN_CACHE_KEY: ${{ steps.bun-cache.outputs.cache-matched-key || steps.bun-cache.outputs.cache-primary-key }}
          VITE_CACHE_HIT: ${{ steps.vite-task-cache.outputs.cache-matched-key != '' }}
          VITE_CACHE_KEY: ${{ steps.vite-task-cache.outputs.cache-matched-key || steps.vite-task-cache.outputs.cache-primary-key }}
        run: |
          tooling/ci/record-application-metrics.sh \
            "$RUNNER_TEMP/application-check-metrics.json" \
            "$GITHUB_STEP_SUMMARY"

      - name: Preserve application check metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-check-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-check-metrics.json
          if-no-files-found: error
          retention-days: 90

  oxlint-benchmark:
    name: Oxlint benchmark (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the Oxlint benchmark
        continue-on-error: true
        run: >-
          ./node_modules/.bin/vp test bench --run
          tooling/oxlint/test/visitor.bench.ts
          --outputJson "$RUNNER_TEMP/oxlint-benchmark.json"

      - name: Preserve Oxlint benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oxlint-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oxlint-benchmark.json
          if-no-files-found: warn
          retention-days: 90

  tooling-live:
    name: Effect tooling (${{ matrix.os }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run live process tests
        run: ./node_modules/.bin/vp test tooling/mze/child-command.test.ts tooling/mze/cli.live.test.ts

      - name: Run live process tests in a container
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          docker run --rm
          --volume "$PWD:/workspace"
          --workdir /workspace
          node:24.18.1-bookworm@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
          ./node_modules/.bin/vp test tooling/mze/cli.live.test.ts

  docker-integration:
    name: Docker smoke test
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and start the applications
        run: docker compose up --detach --build --wait --wait-timeout 180 medusa storefront

      - name: Check the applications
        shell: bash
        run: |
          set -euo pipefail
          medusa_port="$(docker compose port medusa 9000 | sed 's/.*://')"
          storefront_port="$(docker compose port storefront 3001 | sed 's/.*://')"
          curl --fail --silent --show-error "http://127.0.0.1:${medusa_port}/health" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${medusa_port}/app" >/dev/null
          curl --fail --silent --show-error "http://127.0.0.1:${storefront_port}/" >/dev/null

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  docker-image-pr:
    name: Docker image validation (${{ matrix.name }})
    needs:
      - checks
      - docker-integration
      - tooling-live
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        name:
          - medusa
          - storefront
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the pull-request image
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CACHE_SCOPE: ${{ github.event.pull_request.number || github.ref_name }}
          REVISION: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.name }}-ci

      - name: Gate fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: mze-store-${{ matrix.name }}:pr
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  workflow-policy:
    name: Workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate workflows and shell source
        run: actionlint -shellcheck shellcheck -color

  container-definitions:
    name: Container definition checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Check the Medusa Dockerfile
        run: docker buildx build --check --file apps/medusa/Dockerfile .

      - name: Check the Storefront Dockerfile
        run: docker buildx build --check --file apps/storefront/Dockerfile .

  preflight:
    name: CI definition gate
    if: ${{ always() }}
    needs:
      - workflow-policy
      - container-definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require valid definitions
        env:
          PREFLIGHT_RESULTS: ${{ toJSON(needs) }}
        run: jq --exit-status 'all(.[]; .result == "success")' <<<"$PREFLIGHT_RESULTS"

  ci-gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - checks
      - tooling-live
      - docker-integration
      - docker-image-pr
      - workflow-policy
      - container-definitions
      - preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require applicable checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'all(.[]; .result == "success")' <<<"$CHECK_RESULTS"

      - name: Record CI gate timing
        if: always()
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_CREATED_AT="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq .created_at)"
          RECORDED_AT="$(date --utc +%FT%TZ)"
          ELAPSED_SECONDS="$(($(date --date "$RECORDED_AT" +%s) - $(date --date "$RUN_CREATED_AT" +%s)))"
          ACCEPTED_P95_SECONDS=600

          if ((ELAPSED_SECONDS <= ACCEPTED_P95_SECONDS)); then
            TARGET_RESULT=met
          else
            TARGET_RESULT=missed
          fi

          jq --null-input \
            --arg commit "$GITHUB_SHA" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg recordedAt "$RECORDED_AT" \
            --arg runCreatedAt "$RUN_CREATED_AT" \
            --arg targetResult "$TARGET_RESULT" \
            --argjson acceptedP95Seconds "$ACCEPTED_P95_SECONDS" \
            --argjson checkResults "$CHECK_RESULTS" \
            --argjson elapsedSeconds "$ELAPSED_SECONDS" \
            '{
              acceptedP95Seconds: $acceptedP95Seconds,
              checkResults: $checkResults,
              commit: $commit,
              elapsedSeconds: $elapsedSeconds,
              event: $event,
              recordedAt: $recordedAt,
              runCreatedAt: $runCreatedAt,
              targetResult: $targetResult
            }' >"$RUNNER_TEMP/ci-gate-metrics.json"

          {
            echo "## CI gate timing"
            echo "Elapsed seconds: ${ELAPSED_SECONDS}"
            echo "Accepted P95 target: 600 seconds"
            echo "Target result: ${TARGET_RESULT}"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve CI gate timing
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-gate-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-gate-metrics.json
          if-no-files-found: error
          retention-days: 90
