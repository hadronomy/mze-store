name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  # Integration tests route this test-shaped key to local Emulate and block
  # real Stripe traffic. The Docker smoke test only initializes the provider.
  STRIPE_API_KEY: sk_test_ci

jobs:
  checks:
    name: Types, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mze-store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mze-store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add workspace binaries to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check types
        run: vp run -r check-types

      - name: Lint
        run: vp lint

      # Only Medusa has behavior tests. The storefront and auth, db, env, and
      # ui packages use their type-check gates until they gain test suites.
      - name: Run declared tests (Medusa only)
        run: vp run -r test

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Build and start Medusa
        run: docker compose up --detach --build --wait --wait-timeout 180 medusa

      - name: Check /health and /app
        shell: bash
        run: |
          assert_http_200() {
            local url="$1"
            local status

            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]; then
              echo "::error::$url returned HTTP $status"
              return 1
            fi
          }

          assert_http_200 http://localhost:9000/health
          assert_http_200 http://localhost:9000/app

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes
