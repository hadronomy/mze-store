name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integration tests route this test-shaped key to local Emulate and block
  # real Stripe traffic. The Docker smoke test only initializes the provider.
  STRIPE_API_KEY: sk_test_ci

jobs:
  checks:
    name: Types, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mze-store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mze-store"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Add workspace binaries to PATH
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check types
        run: bun run check-types

      - name: Lint
        run: vp lint

      # Auth uses Vite+'s Vitest runner. Medusa keeps Jest because its test
      # utilities require Jest. The root script also tests the lint plugin.
      - name: Run declared tests
        run: bun run test

  docker:
    name: Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and start the applications
        run: docker compose up --detach --build --wait --wait-timeout 180 medusa storefront

      - name: Check the applications
        shell: bash
        run: |
          assert_http_200() {
            local url="$1"
            local status

            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]; then
              echo "::error::$url returned HTTP $status"
              return 1
            fi
          }

          medusa_port="$(docker compose port medusa 9000 | sed 's/.*://')"
          storefront_port="$(docker compose port storefront 3001 | sed 's/.*://')"

          assert_http_200 "http://127.0.0.1:${medusa_port}/health"
          assert_http_200 "http://127.0.0.1:${medusa_port}/app"
          assert_http_200 "http://127.0.0.1:${storefront_port}/"

      - name: Show Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down --volumes

  browser:
    name: Browser test placeholder
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The current spec is a no-op. Add service setup and browser installation
      # when it starts exercising Storefront flows.
      - name: Run the browser test placeholder
        run: bun run test:e2e

      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
