name: Release images

on:
  push:
    branches:
      - main

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-checks:
    name: Release source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Find the Bun download cache
        id: bun-cache-path
        run: echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun download cache
        id: bun-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: bun-download-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-${{ hashFiles('bun.lock') }}

      - name: Start the install timer
        run: echo "INSTALL_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record the install time
        run: echo "INSTALL_SECONDS=$(($(date +%s) - INSTALL_STARTED))" >> "$GITHUB_ENV"

      - name: Restore Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-${{ github.ref_name }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-${{ hashFiles('bun.lock', 'vite.config.ts', 'package.json', 'mise.toml') }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-node24.18.1-bun1.3.14-v1-

      - name: Run repository checks
        run: |
          echo "CHECK_STARTED=$(date +%s)" >> "$GITHUB_ENV"
          bun run check

      - name: Record check duration
        if: always()
        run: echo "CHECK_SECONDS=$(($(date +%s) - CHECK_STARTED))" >> "$GITHUB_ENV"

      - name: Run declared tests
        run: bun run test

      - name: Save Bun download cache
        if: success() && steps.bun-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache-path.outputs.path }}
          key: ${{ steps.bun-cache.outputs.cache-primary-key }}

      - name: Save Vite Task cache
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}

      - name: Report application check metrics
        if: always()
        env:
          BUN_CACHE_HIT: ${{ steps.bun-cache.outputs.cache-matched-key != '' }}
          BUN_CACHE_KEY: ${{ steps.bun-cache.outputs.cache-matched-key || steps.bun-cache.outputs.cache-primary-key }}
          VITE_CACHE_HIT: ${{ steps.vite-task-cache.outputs.cache-matched-key != '' }}
          VITE_CACHE_KEY: ${{ steps.vite-task-cache.outputs.cache-matched-key || steps.vite-task-cache.outputs.cache-primary-key }}
        run: |
          tooling/ci/record-application-metrics.sh \
            "$RUNNER_TEMP/application-check-metrics.json" \
            "$GITHUB_STEP_SUMMARY"

      - name: Preserve application check metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-check-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/application-check-metrics.json
          if-no-files-found: error
          retention-days: 90

  image-build:
    name: Build image (${{ matrix.name }}, ${{ matrix.platform }})
    needs: release-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: medusa
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - name: medusa
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
          - name: storefront
            platform: linux/amd64
            architecture: amd64
            runner: ubuntu-24.04
          - name: storefront
            platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mze-store-${{ matrix.name }}
    services:
      postgres:
        image: postgres:18@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: mze-store
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Record image metadata
        run: |
          echo "CREATED=$(git show --no-patch --format=%cI "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show --no-patch --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Validate maximal provenance inputs
        env:
          CACHE_ARCH: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          TARGET: ${{ matrix.name }}-release
        run: |
          mkdir -p /tmp/release-evidence
          docker buildx bake \
            --file docker-bake.hcl \
            "$TARGET" \
            --print \
            > "/tmp/release-evidence/provenance-inputs-${{ matrix.architecture }}.json"
          bash tooling/ci/verify-provenance-inputs.sh \
            "/tmp/release-evidence/provenance-inputs-${{ matrix.architecture }}.json" \
            "$TARGET"

      - name: Preserve verified provenance inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance-inputs-${{ matrix.name }}-${{ matrix.architecture }}
          path: /tmp/release-evidence/provenance-inputs-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the immutable candidate
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CACHE_ARCH: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          targets: ${{ matrix.name }}-release

      - name: Record the exact platform digest
        env:
          BAKE_METADATA: ${{ steps.bake.outputs.metadata }}
          TARGET: ${{ matrix.name }}-release
        run: |
          DIGEST="$(jq --raw-output --arg target "$TARGET" '.[$target]["containerimage.digest"]' <<<"$BAKE_METADATA")"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Pull the exact platform digest
        run: |
          docker buildx imagetools inspect "${IMAGE_REPOSITORY}@${DIGEST}"
          docker pull --platform "${{ matrix.platform }}" "${IMAGE_REPOSITORY}@${DIGEST}"

      - name: Smoke-test the exact platform digest
        run: tooling/ci/smoke-image.sh "${IMAGE_REPOSITORY}@${DIGEST}" "${{ matrix.name }}"

      - name: Enforce image policy
        uses: ./.github/actions/scan-image
        with:
          image-ref: ${{ env.IMAGE_REPOSITORY }}@${{ env.DIGEST }}
          image-name: ${{ matrix.name }}
          platform: ${{ matrix.platform }}
          architecture: ${{ matrix.architecture }}
          evidence-scope: release
          upload-sarif: "true"

      - name: Upload the platform digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.name }}-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image-index:
    name: Create image index (${{ matrix.name }})
    needs: image-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - medusa
          - storefront
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mze-store-${{ matrix.name }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Download verified provenance inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: provenance-inputs-${{ matrix.name }}-*
          path: /tmp/release-evidence/provenance-inputs
          merge-multiple: true

      - name: Create the multi-platform candidate
        id: index
        run: |
          mapfile -t digests < <(find /tmp/digests -type f -printf '%f\n' | sort)
          test "${#digests[@]}" -eq 2

          references=()
          for digest in "${digests[@]}"; do
            references+=("${IMAGE_REPOSITORY}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            "${references[@]}"
          DIGEST="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${GITHUB_SHA}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify BuildKit evidence
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          mkdir -p /tmp/release-evidence
          docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}@${DIGEST}" \
            --format '{{ json .Provenance }}' \
            > /tmp/release-evidence/provenance.json
          docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}@${DIGEST}" \
            --format '{{ json .SBOM }}' \
            > /tmp/release-evidence/sbom.json
          bash tooling/ci/verify-build-evidence.sh \
            /tmp/release-evidence/provenance.json \
            /tmp/release-evidence/sbom.json

      - name: Attest the exact image index
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Verify the repository attestation
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
          DIGEST: ${{ steps.index.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify \
            "oci://${IMAGE_REPOSITORY}@${DIGEST}" \
            --bundle "$BUNDLE_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners \
            --format json \
            > /tmp/release-evidence/github-attestation.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ matrix.name }}-${{ github.sha }}
          path: |
            /tmp/release-evidence/
            ${{ steps.attestation.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90
