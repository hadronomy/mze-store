<!--
  README banner. Transparent by design: it reads on GitHub's light and dark
  themes alike, so no <picture> swap is needed.

  Every line is anchored at an explicit x with the default start anchor, and
  carries no trailing whitespace. That combination is what keeps the art
  aligned. text-anchor="middle" centres each line on its *measured* advance
  width, and trailing spaces are not reliably counted, so lines padded to a
  common length each land at a different offset — up to 125px apart here, which
  reads as the whole block shearing left. Sharing one x per block removes the
  measurement from the layout entirely.

  x is computed from a 0.6em advance, so a face with different metrics shifts a
  block a few pixels off centre. It cannot shear it.

  The mark is brand/icon.svg density-mapped onto a ' .o8' ramp; the wordmark is
  FIGlet's `roman`, which builds letters from the same dots and eights.

  Colours are neon greens held to the band that survives a transparent ground.
  Anything lighter than #00C658 falls under 2:1 on white, so the brightest steps
  appear only on the decoration. The wave glyphs are U+007E, U+2248, U+223C and
  U+224B — present in the common monospace faces, unlike U+301C and U+2234.

  The decoration starts at a negative x so it overflows both edges and is cut by
  the clipPath, reaching the border without depending on character metrics.
  xml:space="preserve" holds the spacing. Fonts are a system stack because
  GitHub serves this through camo, where no external font ever loads.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="mze store — organic shop center, la laguna, tenerife">
  <defs>
