<!--
  README banner. Transparent by design: it reads on GitHub's light and dark
  themes alike, so no <picture> swap is needed.

  The mark is brand/icon.svg density-mapped onto a ' .o8' ramp; the wordmark is
  FIGlet's `roman`, which builds letters from the same dots and eights, so the
  two read as one drawing.

  Colours are neon greens, but held to the band that survives a transparent
  ground. Anything lighter than #00C658 falls under 2:1 on white and vanishes in
  light mode, so the brightest steps appear only on the decoration, where a faint
  glyph costs nothing.

  The wave glyphs cycle four ways in four colours. They are ~ U+007E, U+2248,
  U+223C and U+224B — chosen because they are present in the common monospace
  faces. U+301C and U+2234 are not, and fall back to tofu.

  xml:space="preserve" is load-bearing: without it the spacing collapses and the
  art shears apart. The decoration runs past the viewBox and is cut by a clipPath
  so it reaches both edges without depending on character metrics, which differ
  between SF Mono, Menlo and Consolas. Fonts are a system stack because GitHub
  serves this through camo, where no external font ever loads.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="mze store — organic shop center, la laguna, tenerife">
  <defs>
