<!--
  README banner. Transparent by design: it reads on GitHub's light and dark
  themes alike, so no <picture> swap is needed.

  The mark is brand/icon.svg density-mapped to a ' .o8' ramp, and the wordmark
  is FIGlet's `roman` font — the same vocabulary of dots and eights, so the two
  read as one drawing. Every colour is a step between --mze-leaf and its tints,
  kept to mid tones because a transparent ground can be white or near-black.

  xml:space="preserve" is load-bearing: without it the spacing collapses and
  the art shears apart. Fonts are a system stack, because GitHub serves this
  through camo where no external font ever loads.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-label="mze store — organic shop center, la laguna, tenerife">
  <defs>
    <clipPath id="mze-banner"><rect width="800" height="460"/></clipPath>
  </defs>
  <g clip-path="url(#mze-banner)">
    <text xml:space="preserve" text-anchor="middle" font-family="'SF Mono','Fira Code','Fira Mono','Roboto Mono','Menlo','Monaco','Consolas',monospace" font-size="13.5">
